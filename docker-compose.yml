services:
  db:
    image: postgres:17-alpine
    container_name: sanjeevani-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanjeevani}
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani}
    ports:
      # host 5433 so a local postgres on 5432 keeps working
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql here run once, in filename order, on an empty data directory
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanjeevani} -d ${POSTGRES_DB:-sanjeevani}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: sanjeevani-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-sanjeevani}:${POSTGRES_PASSWORD:-sanjeevani}@db:5432/${POSTGRES_DB:-sanjeevani}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:-dev-callback-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build: ./web
    container_name: sanjeevani-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # baked at build time for the browser bundle, see web/Dockerfile
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
