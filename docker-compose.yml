services:
  db:
    image: postgres:17-alpine
    container_name: sanjeevani-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanjeevani}
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani}
      # false on anything holding real patients -- the demo staff accounts share
      # one well-known password
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      # host 5433 so a local postgres on 5432 keeps working
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # These run once, in filename order, on an empty data directory. seed.sql is
      # mounted outside this directory on purpose so it runs only through the
      # wrapper, which honours SEED_DEMO_DATA.
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
      - ./db/seed.sql:/seed/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanjeevani} -d ${POSTGRES_DB:-sanjeevani}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: sanjeevani-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-sanjeevani}:${POSTGRES_PASSWORD:-sanjeevani}@db:5432/${POSTGRES_DB:-sanjeevani}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Unset -> the backend answers from its labelled stub. `bash run.sh --profile ai`
      # points this at the rag service; setting it while rag is down means patients
      # get an "assistant unavailable" message instead of stub answers, which is why
      # it is not hardcoded here.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # The first hospital administrator, reconciled on every boot. See .env.example.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_HOSPITAL: ${ADMIN_HOSPITAL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
    ports:
      - "${API_PORT:-4000}:4000"

  # Patient app as Flutter web. The mobile build needs a device or emulator, so
  # this is as far as Docker goes: every screen, in a browser.
  app-web:
    build:
      context: ./app
      args:
        API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        GOOGLE_SERVER_CLIENT_ID: ${GOOGLE_SERVER_CLIENT_ID:-}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
    container_name: sanjeevani-app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_WEB_PORT:-8081}:80"

  # The AI team's triage service. Off by default: `docker compose --profile ai up`.
  # It needs a Gemini key, and the seam works without it -- with AI_SERVICE_URL
  # unset the backend answers from its labelled stub.
  rag:
    build: ./RAG
    container_name: sanjeevani-rag
    profiles: ["ai"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Unset -> pydantic-settings refuses to start and says which field is missing.
      GEMINI_API: ${GEMINI_API:-}
      # The same dockerized Postgres the platform uses. RAG creates its own tables
      # (sessions, session_state, symptoms, doctors) at startup via knowledge.initialize().
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-sanjeevani}:${POSTGRES_PASSWORD:-sanjeevani}@db:5432/${POSTGRES_DB:-sanjeevani}
      PUBLIC_API_URL: http://backend:4000
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      # Chroma pulls an 80MB ONNX embedding model the first time it embeds. Its
      # downloader reads 1KB at a time under httpx's default 5s read timeout, so
      # on a slow link it fails startup outright, and without a cache it starts
      # over on every recreate. Persist it so that download happens once.
      - ragcache:/root/.cache/chroma

  web:
    build: ./web
    container_name: sanjeevani-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # baked at build time for the browser bundle, see web/Dockerfile
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  ragcache:
